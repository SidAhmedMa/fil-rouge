[project]
name = "filrouge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.1.3",
  "pandas==2.2.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "ruff==0.8.4",
  "mkdocs==1.6.1",
  "mkdocs-material==9.5.49",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
